<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 544" width="1180" height="544" role="img" aria-label="The collector reads every account's CloudTrail Event History through IAM Identity Center, and CloudTrail Lake adds data events; both write one event JSON file. The report stage turns it into the HTML dashboard, optionally with current state, a peer baseline and an external analysis."><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#6b7684"/></marker></defs><rect x="24" y="44" width="272" height="288" rx="14" fill="#11151b" stroke="#30363d" stroke-width="1" stroke-dasharray="6 5"/><text x="42.0" y="68.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" fill="#9aa4b0" text-anchor="start" font-weight="600">COLLECT FROM AWS</text><rect x="44" y="84" width="232" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(60.0,97.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10.5a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.3 9.2 4.4 4.4 0 0 0 7 18z"/></g><text x="91.0" y="112.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Event History</text><text x="60.0" y="136.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">aws_offboarding_audit.py</text><text x="60.0" y="154.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">every account, via Identity Center</text><rect x="44" y="220" width="232" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(60.0,233.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6 M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g><text x="91.0" y="248.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">CloudTrail Lake</text><text x="60.0" y="272.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">aws_cloudtrail_lake.py</text><text x="60.0" y="290.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">data events, SQL or an export</text><rect x="372" y="152" width="222" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(388.0,165.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z M14 3v4h4 M9 12h6 M9 16h6"/></g><text x="419.0" y="180.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Event JSON</text><text x="388.0" y="204.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">aws_offboarding_audit.json</text><text x="388.0" y="222.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">one normalised contract</text><rect x="638" y="152" width="236" height="92" rx="10" fill="#4c7ef3" stroke="#4c7ef3" stroke-width="1"/><g transform="translate(654.0,165.0) scale(0.8750)" fill="none" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8h8v8H8z M5 5h14v14H5z M10 2v3 M14 2v3 M10 19v3 M14 19v3 M2 10h3 M2 14h3 M19 10h3 M19 14h3"/></g><text x="685.0" y="180.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#ffffff" text-anchor="start" font-weight="600">Report</text><text x="654.0" y="204.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#ffffff" text-anchor="start" opacity="0.85">aws_audit_report.py</text><text x="654.0" y="222.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" opacity="0.85">detectors, review priority</text><rect x="918" y="152" width="238" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(934.0,165.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16 M8 16v-4 M12 16V8 M16 16v-6"/></g><text x="965.0" y="180.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">HTML dashboard</text><text x="934.0" y="204.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">aws_offboarding_report.html</text><text x="934.0" y="222.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">plus Markdown and a summary</text><rect x="372" y="372" width="222" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(388.0,385.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6z M8.5 12l2.5 2.5 4.5-4.5"/></g><text x="419.0" y="400.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Current state</text><text x="388.0" y="424.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">aws_current_state.py</text><text x="388.0" y="442.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">does it still exist?</text><rect x="638" y="372" width="236" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(654.0,385.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z M2.5 20c.6-3.5 3.3-6 6.5-6s5.9 2.5 6.5 6 M16 4.5a3.5 3.5 0 0 1 0 6.5 M18 14c2 .7 3.3 2.8 3.5 6"/></g><text x="685.0" y="400.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">Peer baseline</text><text x="654.0" y="424.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">audit_baseline.py</text><text x="654.0" y="442.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">three or more peer audits</text><rect x="918" y="372" width="238" height="92" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/><g transform="translate(934.0,385.0) scale(0.8750)" fill="none" stroke="#e6edf3" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z M8 9.5h8 M8 12.5h5"/></g><text x="965.0" y="400.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#e6edf3" text-anchor="start" font-weight="600">External analysis</text><text x="934.0" y="424.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" fill="#9aa4b0" text-anchor="start">audit_analyst.py</text><text x="934.0" y="442.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">redacted digest, advisory</text><polyline points="284,130.0 364,184.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="284,266.0 364,212.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="602,198.0 630,198.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="882,198.0 910,198.0" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><polyline points="483.0,252 483.0,364" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="493.0" y="312.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11.5" fill="#aeb7c2" text-anchor="start">flagged resources</text><polyline points="602,418.0 678,252" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="654.0" y="312.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">--state</text><polyline points="756.0,364 756.0,252" fill="none" stroke="#6b7684" stroke-width="1.5" marker-end="url(#a)"/><text x="766.0" y="312.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">--baseline</text><polyline points="834,252 910,418.0" fill="none" stroke="#6b7684" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)" marker-start="url(#a)"/><text x="888.0" y="312.0" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" fill="#aeb7c2" text-anchor="start">--analyze</text><line x1="24" y1="492" x2="1156" y2="492" stroke="#232a33" stroke-width="1"/><text x="24.0" y="518.0" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" fill="#9aa4b0" text-anchor="start">Collection and reporting are separate: the dashboard rebuilds from saved event JSON without querying AWS again, and every AWS call either stage makes is a read.</text></svg>