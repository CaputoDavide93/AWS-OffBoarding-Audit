target-version = "py311"
line-length = 110

[lint]
select = ["E", "F", "W"]
# Long prose strings and SQL are common here; readability beats wrapping.
ignore = ["E501"]

[lint.per-file-ignores]
"tests/*" = ["E402"]
# The drawing primitives set fill, edge and text colour together on one line.
"tools/gen_diagram.py" = ["E702"]
# Vendored brand kit, kept as shipped so it stays diffable against the original.
"tools/brand/brand_kit.py" = ["E401", "E701", "E702", "E731", "E741", "F541", "F841"]
